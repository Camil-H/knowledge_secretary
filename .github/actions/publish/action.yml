name: Publish digest
description: Commit the history/state snapshot and publish the built site to the personal Pages repo.

inputs:
  commit-prefix:
    description: Label for the snapshot commit message ("<prefix> run <date>").
    required: true
  pages-token:
    description: Personal access token for pushing the built site to the external Pages repo.
    required: true
  pages-repository:
    description: External Pages repo to publish to ("owner/repo").
    required: false
    default: Camil-H/camil-h.github.io
  pages-destination-dir:
    description: Subdirectory within the Pages repo to publish the site into.
    required: false
    default: knowledge_secretary

runs:
  using: composite
  steps:
    - name: Commit history + state
      shell: bash
      run: |
        git config user.name  "digest-bot"
        git config user.email "digest-bot@users.noreply.github.com"
        git add history state
        if git diff --cached --quiet; then
          echo "nothing to commit; skipping push"
          exit 0
        fi
        git commit -m "${{ inputs.commit-prefix }} run $(date -u +%F)"
        for attempt in 1 2 3 4 5; do
          git fetch origin main
          if ! git rebase origin/main; then
            # another run touched the same day's history/state; union rather than fail
            uv run python -m src.delivery.reconcile || { git rebase --abort; echo "::error::reconcile failed"; exit 1; }
            GIT_EDITOR=true git rebase --continue || { echo "::error::rebase --continue failed"; exit 1; }
          fi
          if git push; then
            echo "published on attempt $attempt"
            exit 0
          fi
          echo "push rejected (attempt $attempt); another run pushed first — retrying"
        done
        echo "::error::failed to publish state after 5 attempts"
        exit 1
    - name: Publish site to Pages repo
      if: hashFiles('public/index.html') != ''
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0
      with:
        personal_token: ${{ inputs.pages-token }}
        external_repository: ${{ inputs.pages-repository }}
        publish_branch: main
        publish_dir: ./public
        destination_dir: ${{ inputs.pages-destination-dir }}
        keep_files: true   # never clobber the rest of the personal site
        enable_jekyll: true
