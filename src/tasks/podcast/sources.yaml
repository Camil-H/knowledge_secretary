# Podcast topics. Worked through as a queue, one per run (each used once).
- "PROTACs and targeted protein degradation: mechanism, ternary complex formation, and the hook effect"
- "Covalent inhibitors: reversible vs irreversible warheads, selectivity, and the KRAS G12C story"
- "Medal Fields - Hong Wang: For her work in harmonic analysis and geometric measure theory, including applications of multiscale and decoupling techniques to the local smoothing conjecture for the planar wave equation, and major advances in Fourier restriction, Falconer distance sets, Furstenberg sets in the plane, and the Kakeya problem in three dimensions."
- "Medal Fields - Yu Deng: For his work in partial differential equations, including the rigorous derivation of the Boltzmann equation from hard-sphere dynamics for rarefied gases, the derivation of wave kinetic equations from nonlinear dispersive systems, and probabilistic approaches to nonlinear Schrodinger dynamics."
- "Medal Fields - John Pardon: For his achievements in symplectic geometry including new approaches to virtual fundamental cycles, Fukaya categories of certain manifolds and counting holomorphic curves, and for his contributions to other areas of geometry and topology, including group actions on 3-manifolds and knot theory."
- "Medal Fields - Jacob Tsimerman: For his contribution in the recasting of o-minimality as a fundamental method of arithmetic and complex algebraic geometry, and his role in the proof of many central conjectures including Griffiths' conjecture on the algebraicity of images of the period maps, and the Andre-Oort conjecture for Siegel modular varieties."
